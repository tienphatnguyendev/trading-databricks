[project]
name = "trading-databricks"
version = "0.1.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pyarrow==18.0.0",
    "scikit-learn==1.6.1",
    "spacy==3.8.4",
    "lightgbm==4.6.0",
    "scipy==1.16.0",
    "mlflow==3.0.1",
    "databricks-sdk==0.102.0",
    "python-dotenv==1.1.1",
    "loguru==0.7.3",
    "polars>=1.39.3",
    "datasets>=4.0.0",
    "langgraph>=1.1.6",
    "plotly>=6.7.0",
    "databricks-vectorsearch>=0.66",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "chispa>=0.9,<1",
    "databricks-agents>=0.16.0",
    "databricks-connect>=17.3.7",
    "ipykernel>=6.29.5,<7",
    "matplotlib>=3.9.0",
    "plotly>=5.0",
    "pre-commit>=4.1.0,<5",
    "pytest-mock>=3.15.1",
    "pytest>=8.4.2",
    "ruff>=0.9.0,<1",
]
ci = [
    "pre-commit>=4.1.0,<5",
    "pytest>=8.3.4,<9",
    "chispa>=0.9,<1",
]
forecasting = [
    "xgboost==3.4.1; sys_platform == 'darwin'",
    "xgboost-cpu==3.4.1; sys_platform != 'darwin'",
]

[build-system]
requires = [
    "setuptools>=72.0",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-s --no-header --no-summary"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "B",
    "I",
    "UP",
    "SIM",
    "ERA",
    "ANN",
]
ignore = [
    "ERA001",
]

[tool.ruff.format]
indent-style = "space"

[dependency-groups]
dev = [
    "chispa>=0.9,<1",
    "databricks-agents>=0.16.0",
    "databricks-connect>=17.3.7",
    "ipykernel>=6.29.5,<7",
    "matplotlib>=3.9.0",
    "plotly>=5.0",
    "pre-commit>=4.1.0,<5",
    "pytest-mock>=3.15.1",
    "pytest>=8.4.2",
    "ruff>=0.9.0,<1",
]
