bundle:
  name: trading-databricks

variables:
  catalog:
    description: Unity Catalog catalog name (e.g. trading-signal-gen-dev)
    default: trading-signal-gen-dev
  bucket:
    description: S3 bucket name containing raw data
    default: ai-trading-raw-ap-southeast-1
  checkpoint_base:
    description: S3 path prefix for Auto Loader checkpoints
    default: s3://ai-trading-raw-ap-southeast-1/checkpoints

include:
  - resources/*.yml

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-73b04434-2ca0.cloud.databricks.com
    variables:
      catalog: trading-signal-gen-dev
  staging:
    workspace:
      host: https://dbc-73b04434-2ca0.cloud.databricks.com
    variables:
      catalog: trading-signal-gen-staging
  prod:
    workspace:
      host: https://dbc-73b04434-2ca0.cloud.databricks.com
    variables:
      catalog: trading-signal-prod
