bundle:
  name: trading-databricks
  databricks_cli_version: ">= 0.218.0"
  deployment:
    fail_on_active_runs: true

variables:
  catalog:
    description: Unity Catalog catalog name (e.g. trading-signal-gen-dev)
    default: trading-signal-gen-dev
  bucket:
    description: S3 bucket name containing raw data
    default: ai-trading-raw-ap-southeast-1
  bronze_schema:
    description: Schema for bronze (raw) Delta tables
    default: bronze
  silver_schema:
    description: Schema for silver (cleaned) Delta tables
    default: silver
  gold_schema:
    description: Schema for gold (feature/bar) Delta tables
    default: gold
  schema_location_base:
    description: Base Volume path for Auto Loader cloudFiles schema metadata
    default: /Volumes/${var.catalog}/pipeline_metadata/trading_databricks_metadata/schemas

include:
  - resources/*.yml

workspace:
  host: https://dbc-73b04434-2ca0.cloud.databricks.com

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: trading-signal-gen-dev

  staging:
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: trading-signal-gen-staging
    presets:
      trigger_pause_status: PAUSED

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: trading-signal-prod
    # run_as:
    #   service_principal_name: <TBD — provision SP and uncomment>
