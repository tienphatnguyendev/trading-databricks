resources:
  jobs:
    news_pipeline:
      name: news-pipeline-${bundle.target}
      description: "Bronze ingestion + silver transform + gold features for financial news"

      schedule:
        quartz_cron_expression: "0 */15 * * * ?"  # every 15 minutes
        timezone_id: UTC
        pause_status: UNPAUSED

      tasks:
        - task_key: bronze_ingest
          description: "Auto Loader: S3 NDJSON → bronze.news_raw"
          spark_python_task:
            python_file: ../src/news/bronze/ingest_news.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--bucket"
              - "${var.bucket}"
              - "--checkpoint-base"
              - "${var.checkpoint_base}"
          new_cluster: &job_cluster
            spark_version: 17.3.x-ml-scala2.13
            node_type_id: m5.xlarge
            autoscale:
              min_workers: 1
              max_workers: 2
            enable_elastic_disk: true
            aws_attributes:
              availability: SPOT_WITH_FALLBACK
              first_on_demand: 1
              spot_bid_price_percent: 100

        - task_key: silver_clean
          description: "Dedup + cast + normalize: bronze → silver.news_cleaned"
          depends_on:
            - task_key: bronze_ingest
          spark_python_task:
            python_file: ../src/news/silver/clean_news.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
          new_cluster: *job_cluster

        - task_key: gold_features
          description: "Feature engineering: silver → gold.news_features"
          depends_on:
            - task_key: silver_clean
          spark_python_task:
            python_file: ../src/news/gold/news_features.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
          new_cluster: *job_cluster
