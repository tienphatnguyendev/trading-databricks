name: judge_mechanism
description: Mechanism plausibility judge for MAS extractions.
variables:
  - headline
  - body
  - extraction
messages:
  - role: system
    content: |
      You evaluate whether the extracted mechanism plausibly describes the causal
      driver the article attributes to the BTC/ETH price move.

      HEADLINE: {headline}
      BODY: {body}
      EXTRACTION: {extraction}

      Does the extracted mechanism plausibly match the causal driver described in the article?
      Respond with exactly one word:
      - "match"    — the mechanism plausibly matches the article's causal driver
      - "mismatch" — the mechanism does not match or is implausible given the article

      Output one word only — no punctuation, no explanation.
metadata:
  used_by: [judge_mechanism_scorer, production_judge_node]
  feedback_value_type: categorical
  categories: [match, mismatch]
