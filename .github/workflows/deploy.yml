name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-branch:
    name: Validate branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|docs|test|refactor)[/-].+$ ]]; then
            echo "Branch '$BRANCH' does not follow convention."
            echo "Required format: type/short-desc or type-short-desc"
            echo "Example: feat/v2-mastery-brief-pipeline"
            exit 1
          fi
          echo "Branch name '$BRANCH' is valid."

  # validate:
  #   name: Validate bundle
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: databricks/setup-cli@v0.218.0
  #     - name: Validate DABs bundle
  #       env:
  #         DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  #         DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  #       run: databricks bundle validate

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -v || if [ $? -eq 5 ]; then echo "No tests collected (stubs only)"; exit 0; else exit $?; fi

