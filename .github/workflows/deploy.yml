name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-branch:
    name: Validate branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|docs|test|refactor)/TRD-[0-9]+-[a-z0-9-]+$ ]]; then
            echo "Branch '$BRANCH' does not follow convention."
            echo "Required format: type/TRD-NNN-short-desc"
            echo "Example: feat/TRD-42-add-news-silver-layer"
            exit 1
          fi
          echo "Branch name '$BRANCH' is valid."

  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate DABs bundle
        run: databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -v; code=$?; [ $code -eq 5 ] && echo "No tests collected (stubs only)" || exit $code

  deploy-staging:
    name: Deploy to staging
    needs: [validate, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy to staging
        run: databricks bundle deploy -t staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_VAR_bucket: ${{ secrets.S3_BUCKET }}
          DATABRICKS_BUNDLE_VAR_checkpoint_base: ${{ secrets.CHECKPOINT_BASE }}

  deploy-prod:
    name: Deploy to prod
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy to prod
        run: databricks bundle deploy -t prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_VAR_bucket: ${{ secrets.S3_BUCKET }}
          DATABRICKS_BUNDLE_VAR_checkpoint_base: ${{ secrets.CHECKPOINT_BASE }}
